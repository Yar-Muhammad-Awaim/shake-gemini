name: Build & Release ShakeGemini APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Grants GitHub Actions permission to create a Release and attach the APK
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK for easy installation
        run: mv app/build/outputs/apk/debug/app-debug.apk ShakeGemini.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "ShakeGemini v1.0.${{ github.run_number }}"
          body: |
            ### Direct Installation (Infinix Hot 12 Pro - Android 12)
            Tap **ShakeGemini.apk** under **Assets** below to download and install directly on your phone.
          files: ShakeGemini.apk
          draft: false
          prerelease: false
