plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.shakegemini'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.shakegemini"
        minSdk 26
        targetSdk 32
        versionCode 5
        versionName "2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
